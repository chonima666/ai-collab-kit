name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end tests
        run: bash tests/run.sh
      - name: Shell syntax
        run: for f in scripts/*.sh tests/run.sh; do bash -n "$f"; done
