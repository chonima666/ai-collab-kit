name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Test the PR head itself, not GitHub's synthetic merge commit, so the result is evidence
      # for the SHA the PR declares (REVIEW_PROTOCOL §2.1).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record tested commit
        run: |
          echo "Tested commit: $(git rev-parse HEAD)"
      - name: End-to-end tests
        # On macOS put the system Bash 3.2 first so compatibility is actually exercised.
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="/bin:/usr/bin:$PATH"; fi
          bash --version | head -1
          bash tests/run.sh
      - name: Shell syntax
        run: for f in scripts/*.sh tests/run.sh; do bash -n "$f"; done
